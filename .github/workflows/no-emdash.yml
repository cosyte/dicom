name: Em-dash gate

# The brand rule (founder directive 2026-07-24, written down in the knowledgebase
# repo at 06-brand/voice-and-tone.md: "No em dashes. Ever.") bans U+2014 outright
# across every cosyte surface, and names commit messages explicitly.
# `documentation/conventions.md` in the meta-repo has claimed the rule is CI-gated
# since it was written. This workflow is the CI half of that rule for dicom: the
# tracked files, and the text that is not a file.
#
# dicom was NOT already clean when this landed, which is the one thing worth reading
# twice. An earlier survey measured markdown only (0 of 25 `.md` files) and concluded
# no content churn was needed. Measuring all 178 tracked files found six live em
# dashes in four non-markdown files (`.github/CODEOWNERS`, this directory's
# `release.yml`, the npm `description` in `package.json`, and `vendor/nema/SHA.txt`).
# The slice that added this workflow removed all six. Beyond that the gate exists to
# stop a regression, and a green run on a clean tree proves nothing on its own, which
# is exactly why the script it calls refuses to print OK from a scan that did not read
# everything it was handed.
#
# dicom also holds one tracked file with a functional NUL byte
# (`src/dataset/vr/charset.ts`, DICOM's own padding stripped by a regex whose character
# class holds the byte). grep classifies it binary. It carries no em dash today so it
# scans green; if it ever gains one, grep reports a binary-file match on stderr instead
# of a line on stdout, and the script's stderr capture reds the run. Measured, not
# assumed. The script header has the full account.
#
# WHAT ACTUALLY SCANS, AND WHERE THE RULE LIVES. `pnpm check:no-emdash`, which is this
# repository's own `scripts/check-no-emdash.sh`. The jobs below delegate the plumbing
# (checkout, pnpm, Node) to the shared gate workflow, and that workflow carries no
# pattern, no allow-list and no file selection of its own: it prepares the tree, runs
# the command, and lets the command's exit status decide the job. So the rule, the
# variant and every measurement above stay in this repository.
#
# TWO CONTEXTS, NOT ONE, AND THE JOB ID IS LOAD-BEARING. A called job's check run is
# named `<caller job id> / <inner job id>`, so the job id `no-emdash` below publishes
# `no-emdash / tracked-files` and `no-emdash / messages`. A branch ruleset binds to
# those exact strings: renaming the job detaches the requirement with no error
# anywhere, and a required context nothing emits blocks every pull request. Do not
# rename it.
#
#   `no-emdash / tracked-files` is REQUIRED and is the one that blocks a merge.
#   `no-emdash / messages` runs, reds its own context, and is deliberately NOT required.
#   Dependabot composes a pull request body out of upstream release notes, em dashes
#   included, and a gate that fails on someone else's clock becomes a tax. The detection
#   is unchanged either way; only what blocks is narrowed.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml:
#
#   The shared ci pipeline is not an option. dicom's `ci` job calls
#   cosyte/.github/.github/workflows/ci.yml@main, which runs a fixed ladder and no
#   arbitrary repo script. Adding the gate there would also flip crew, config, iac,
#   and assets red on their next run: all four violate the ban wholesale today, and
#   remediating them is separate, founder-gated work. A shared pipeline is the wrong
#   place to land a rule several of its callers cannot yet satisfy. The correct
#   variant of the script also differs per repo (repos with no binaries take
#   knowledgebase's text-only shape, repos tracking undeclared binaries take website's
#   NUL-partition one), so the gate stays per-repo until every caller carries a script.
#
#   Within dicom, the deciding factor is the trigger. The PR-text half below needs the
#   `edited` activity type, which is not a default: without it, a title or body edited
#   after the last push is never re-checked. What makes that matter is exactly what a
#   squash merge lands here, which is a repo setting and was read rather than assumed:
#   `squash_merge_commit_title: COMMIT_OR_PR_TITLE` and
#   `squash_merge_commit_message: COMMIT_MESSAGES`. So the subject on main comes from the
#   PR title (or from the lone commit's subject), and the body is the branch commit
#   messages concatenated. The PR BODY does not land. It is scanned anyway, deliberately:
#   it is a cosyte surface in its own right and it costs nothing to cover. But ci.yml's
#   triggers drive the shared pipeline over the Node 22 + 24 matrix (typecheck, lint, format,
#   PHI scan, test, coverage, build, attw, dual ESM/CJS smoke). Re-running all of that
#   every time someone fixes a typo in a PR description is a large cost for no extra
#   safety. Same call hl7, fhir, pathways, website, x12 and ncpdp made, for the same
#   reason.
#
#   Both halves live here rather than splitting the file scan back into ci.yml (which
#   is how website ended up): the file scan is a checkout and one grep, so it costs
#   nothing to re-run on `edited`, and one file is one thing to read.
#
# Run the file half locally with `pnpm check:no-emdash`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberate and load-bearing. See the note above.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-emdash:
    # Pinned to the 40 character commit, not to the tag beside it: a tag can be moved
    # or deleted by anyone who gains write access to the workflow's repository, so a
    # tag is not an immutable reference and is not a pin. The trailing comment is the
    # published reference that commit was released as, so the release note stays
    # findable from here.
    uses: cosyte/.github/.github/workflows/gate-no-emdash.yml@84ecccd771cbc9c1ece003a3f8ff61415360395b # workflows-2026-09-18-84ecccd771cb
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
