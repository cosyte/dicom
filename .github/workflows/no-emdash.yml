name: Em-dash gate

# We do not use the em dash (U+2014) or the en dash (U+2013) in any file, commit
# message, or pull request text. This workflow checks both for dicom: the tracked
# files, and the text that is not a file.
#
# The file half runs `pnpm check:no-emdash`, which is `cosyte-no-emdash` from the
# `@cosyte/script-utils` devDependency. What it leaves out here is declared in
# `scripts/check-no-emdash.exclude` (the frozen CHANGELOG.md archive and the
# pinned vendor documents). The gate refuses to report clean from a scan that did
# not read everything it was handed. One tracked file holds a functional NUL byte
# (`src/dataset/vr/charset.ts`, in a regex that strips DICOM's padding); the gate
# reads it as text, so a dash in it would still fail the check.
#
# The jobs below delegate the checkout, pnpm, Node, and the install to the shared
# gate workflow, which carries no pattern, no allow-list, and no file selection of
# its own: it prepares the tree, runs the command, and the command's exit status
# decides the job.
#
# TWO CONTEXTS, AND THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-emdash` below publishes
# `no-emdash / tracked-files` and `no-emdash / messages`. A branch ruleset binds to
# those exact strings: renaming the job detaches the requirement with no error
# anywhere, and a required context nothing emits blocks every pull request. Do not
# rename it.
#
#   `no-emdash / tracked-files` is required and is the one that blocks a merge.
#   `no-emdash / messages` runs and reds its own context, and is not required:
#   Dependabot writes a pull request body from upstream release notes, dashes
#   included, and a required check that fails on text we did not write would
#   block every bump. The detection is the same either way.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml. The shared ci pipeline that
# `ci.yml` calls runs a fixed list of steps and no repo script, and the trigger
# differs. The pull request text half needs the `edited` activity type, which is
# not a default: without it, a title or body edited after the last push is never
# re-checked, and a squash merge writes the title and body into `main` (read the
# merge settings with `gh api repos/cosyte/dicom`). The branch commit messages are
# scanned as well. Re-running the whole `ci.yml` matrix on every edit of a pull
# request description would cost a great deal for no extra safety, while the file
# scan is a checkout and one command, so both halves live here.
#
# Run the file half locally with `pnpm check:no-emdash`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberate and load-bearing. See the note above.
    types: [opened, synchronize, reopened, edited]

# No concurrency group. A push and a title or body edit can arrive together (Dependabot does both),
# and a run a group cancels, even a queued one under `cancel-in-progress: false`, can count as a
# failed required check and block the merge until someone re-runs it. Each run takes seconds, so
# every one finishes and the newest result stands.

permissions:
  contents: read

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-emdash:
    # Called by the published reference's name, as its release notes show, the same
    # reference every other caller in this directory names. That release is immutable,
    # so GitHub refuses to move or delete its tag, and the name keeps the release note
    # findable from here.
    uses: cosyte/.github/.github/workflows/gate-no-emdash-install.yml@ee3e8abed80294c3bb6bfcb4a6e54330be2df8b1 # workflows-2026-11-28-ee3e8abed802
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
