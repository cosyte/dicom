name: Release

# Thin caller of the shared release pipeline: Changesets -> npm publish (provenance auto-enables when
# this repo is public) -> docs artifacts -> GitHub release -> repository_dispatch to cosyte/docs.
# npm authenticates by trusted publishing (OIDC), so there is no npm token: the package's
# trusted-publisher entry on npmjs.com names this repository and `release.yml` (this file).
# `secrets: inherit` passes RELEASE_PR_TOKEN (authors the "Version Packages" PR, so its checks run)
# and DOCS_REPO_DISPATCH_TOKEN (the docs rebuild); store both as repository or organization
# secrets, not as `release` environment secrets.
#
# @cosyte/dicom is public and published on npm. package.json carries no `private` field, so
# `changeset publish` really publishes.

on:
  push:
    branches: [main]

# Read-only by default: the release job below grants itself the writes the shared pipeline needs.
permissions:
  contents: read

jobs:
  release:
    # Required. The repo default for GITHUB_TOKEN is `contents: read`, and a called workflow can only
    # downgrade the caller's token, never escalate it, so without this the shared pipeline's
    # `contents/id-token/pull-requests: write` is an escalation and GitHub rejects the whole workflow
    # at startup (1s, no jobs, no logs). That is what every Release run did from June until this.
    permissions:
      actions: read # the shared workflow reads this caller's environment protection with it
      contents: write # create tags / the GitHub release
      id-token: write # npm trusted publishing and provenance
      pull-requests: write # open the "Version Packages" PR
    uses: cosyte/.github/.github/workflows/release.yml@398cd4ded647dddd9f2e220ceb042840f59e1426 # workflows-2026-11-10-398cd4ded647
    with:
      package-name: "@cosyte/dicom"
      # The release gates, each a step of the shared `version` job, run before anything publishes.
      # test/ci/platform-matrix.test.ts holds them, and holds this file to the commit ci.yml names.
      # - The latest weekly mutation result: the newest completed run of weekly-mutation.yml on
      #   main must have succeeded and be at most 8 days old. On for every caller, so
      #   `mutation-workflow` and `mutation-max-age-days` keep their defaults. Until
      #   weekly-mutation.yml has a green run on main, a release stops here.
      # - The benchmarks: `pnpm test:perf`, then bench/dicom.bench.mjs timed against the build with
      #   `cosyte-bench run` and checked with `cosyte-bench check`.
      # - The package checks: the manifest names only specifiers a registry can resolve, then
      #   `npm pack`, every declared file and `exports` target is in the tarball, it installs into
      #   a clean directory and each entry point loads by name.
      # Provenance and an SBOM attached to the GitHub release are on for every caller.
      #
      # `run-tarball-samples` stays off for now. That gate runs every `ts` and `js` block under
      # docs-content/, and the pages still carry illustrative blocks that are not meant to run on
      # their own (a `ds` from an earlier block, a `study.dcm` path). It turns on once each such
      # block is marked `no-run <reason>`; the `runnable` blocks already run against the build in
      # test/docs-content.test.ts.
      run-benchmarks: true
      bench-suites: bench/dicom.bench.mjs
      run-package-checks: true
    secrets: inherit
