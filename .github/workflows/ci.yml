name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run on main, 05:07 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "7 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on its default Node matrix, 22, 24, and 26. dicom ships a PHI
  # scanner, so the shared pipeline's optional PHI-scan step is switched on.
  #
  # Every call into cosyte/.github names one published reference by its name, as that release's
  # notes show, and the callers in this directory move to the next one together. The release is
  # immutable, so GitHub refuses to move or delete its tag, and nothing reaches this pipeline until
  # this line changes. The shared actionlint job runs rhysd/actionlint's release binary, checked by
  # its SHA-256, so it runs on the nightly `schedule` run as well.
  #
  # The performance standard's two jobs run beside `verify`, never after it, so a pull request waits
  # for the slowest job rather than their sum:
  # - `scaling-gate`: `pnpm test:perf`, the scaling gates on `parseDicom`, on reading every tag and
  #   on `serializeDicom`, and their self-checks, never under coverage. A skipped job satisfies a
  #   required check, so require `ci / scaling-gate` only while its input below stays on.
  # - `bench-compare` (pull requests only): bench/dicom.bench.mjs timed on the base build and the
  #   head build, interleaved on one runner, at each shape's first size. Advisory: it never fails,
  #   so never require it. The large sizes are measured by bench.yml's reading instead.
  #
  # The `deno` job runs the `test` script under Deno, with Node off PATH, so `serializeDicom` and
  # the rest of the suite are held to running there. A skipped job satisfies a required check, so
  # require `ci / deno` only while `run-deno` below stays on.
  #
  # This caller alone is one release ahead of the others: the release of commit 0be6757a7738 is the
  # first with those two jobs. Its name carries its date, which a PHI scan of a changed file reads
  # as a date of service, so the comment names its commit instead. The other callers move to it
  # with the next change to them.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@0be6757a773885cbd5165dbfa0f93772d907b3e8 # the release of 0be6757a7738
    with:
      run-phi-scan: true
      run-scaling-gate: true
      run-bench-compare: true
      bench-suites: bench/dicom.bench.mjs
      run-deno: true

  # The runnable examples under examples/, checked the way a consumer meets them: each imports
  # `@cosyte/dicom` by name, which resolves through package.json `exports` to the BUILT dist/, so
  # the build runs first. Each example asserts its own output, so `pnpm examples` goes red when one
  # drifts from the package. The PHI scan's default roots (test/, README.md, docs-content/) do not
  # reach examples/, so the example files are named to it here. Actions are pinned by commit SHA,
  # the same pins dictionary-regen.yml uses.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck:examples
      - run: pnpm lint:examples
      - run: pnpm examples
      - run: pnpm phi-scan:examples

  # The house checks from @cosyte/script-utils, and `cosyte-process check`, which grades the
  # process wiring: the verb scripts, cosyte-process.config.json, and the direct vitest pin.
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:readme
      - run: pnpm check:claude-card
      - run: pnpm check:catalog
      - run: pnpm check:process
