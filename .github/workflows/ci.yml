name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on the standard Node matrix. dicom ships a PHI scanner, so the
  # shared pipeline's optional PHI-scan step is switched on.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@main
    with:
      run-phi-scan: true

  # The runnable examples under examples/, checked the way a consumer meets them: each imports
  # `@cosyte/dicom` by name, which resolves through package.json `exports` to the BUILT dist/, so
  # the build runs first. Each example asserts its own output, so `pnpm examples` goes red when one
  # drifts from the package. The PHI scan's default roots (test/, README.md, docs-content/) do not
  # reach examples/, so the example files are named to it here. Actions are pinned to the commits
  # the tags dictionary-regen.yml uses resolve to.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck:examples
      - run: pnpm lint:examples
      - run: pnpm examples
      - run: pnpm phi-scan:examples
