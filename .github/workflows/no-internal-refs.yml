name: Public-surface gate

# Founder directive of 2026-07-27: no internal project bookkeeping on any
# surface a consumer of `@cosyte/dicom` reads. Work-item and roadmap ids, phase
# and wave language, roadmap and plan citations, ADR numbers, meta-repo paths
# and commentary about how the work is being run belong in the changelog, the
# changesets, commit messages, pull request text, `test/`, and this repository's
# own agent-context docs. This workflow is the CI half of that rule for dicom.
#
# `cosyte-internal-refs`, the shared gate from `@cosyte/script-utils`, enforces
# it, configured by `scripts/internal-refs.json`: what is a finding and where it
# looks. This file only decides WHEN it runs. Run it locally with
# `pnpm check:no-internal-refs`.
#
# dicom was NOT already clean when this landed, and that is the thing worth
# reading twice. Measured with the checker's own rules at `91b2c33`: 530
# findings, 526 of them under `src/`, against 4 in the markdown a documentation
# review actually reads. The build copies `src/` comment blocks verbatim into
# the published `dist/index.d.ts` and `dist/index.d.cts`, so that is where the
# rule regrows unseen and why a note would not have held. The change that added
# this workflow rewrote all 530. The shared gate, configured by
# `scripts/internal-refs.json`, reports every one of those 530 lines on the same
# tree.
#
# WHAT IS SHARED AND WHAT IS NOT. The job below delegates the plumbing (checkout,
# pnpm, Node, and the install the gate needs) to the shared gate workflow, which
# carries no pattern, no allow-list and no file selection of its own: it prepares
# the tree, runs the command, and lets the command's exit status decide the job.
# The engine and its canonical rules are shared. What stays here, in
# `scripts/internal-refs.json`, is what is a property of the package: the prefixes,
# the standards designations, the surface, and dicom's own extra rules (here
# `CP-246` is a DICOM Change Proposal and `MRN-42` is example patient-identifier
# data, and neither is a work item).
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml. dicom's `ci` job calls the
# shared ci pipeline, which runs a fixed ladder and no arbitrary repo script.
#
#   Unlike `no-emdash.yml` this gate has NO pull-request-text half and wants no
#   `edited` trigger. Commit messages and pull request text are surfaces the
#   identifiers BELONG on, so there is nothing there to scan; the checker reads
#   tracked files and nothing else.
#
# A checkout, an install from the committed lockfile and one scan is the whole
# job, which is what keeps this cheap enough to run on every push.
#
# THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-internal-refs` below
# publishes `no-internal-refs / public-surface`, which is the context a branch
# ruleset must require. Renaming the job detaches that requirement with no error
# anywhere, and a required context nothing emits blocks every pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-internal-refs:
    # Called by the published reference's name, as its release notes show, the same
    # reference every other caller in this directory names. That release is immutable,
    # so GitHub refuses to move or delete its tag, and the name keeps the release note
    # findable from here.
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs-install.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
