name: Public-surface gate

# Keeps internal project bookkeeping off every surface a user of `@cosyte/dicom`
# reads: the README, the docs pages, the source (the published sourcemaps carry
# it, comments included), the tests, and these workflow files. Work-item and
# decision ids, plan and roadmap names, private repository paths, and notes on
# how the work is run belong in commit messages and pull request text instead.
#
# `cosyte-internal-refs`, the shared gate from `@cosyte/script-utils`, decides
# what is a finding, configured by `scripts/internal-refs.json`: the project
# prefixes, the standards designations (a DICOM Change Proposal such as `CP-246`
# is not a work item), the surface, and dicom's own extra rules. This file only
# decides when it runs. Run it locally with `pnpm check:no-internal-refs`.
#
# The job delegates the checkout, pnpm, Node, and the install to the shared gate
# workflow, which carries no pattern, no allow-list, and no file selection of its
# own: it prepares the tree, runs the command, and the command's exit status
# decides the job. It is a separate workflow because the shared ci pipeline that
# `ci.yml` calls runs a fixed list of steps and no repo script.
#
# It has no pull request text half, unlike `no-emdash.yml`, and so no `edited`
# trigger: commit messages and pull request text are where these identifiers
# belong, and the gate reads tracked files only.
#
# THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-internal-refs` below
# publishes `no-internal-refs / public-surface`, which is the context a branch
# ruleset must require. Renaming the job detaches that requirement with no error
# anywhere, and a required context nothing emits blocks every pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-internal-refs:
    # Called by the published reference's name, as its release notes show, the same
    # reference every other caller in this directory names. That release is immutable,
    # so GitHub refuses to move or delete its tag, and the name keeps the release note
    # findable from here.
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs-install.yml@ee3e8abed80294c3bb6bfcb4a6e54330be2df8b1 # workflows-2026-11-28-ee3e8abed802
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
