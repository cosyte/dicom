name: Dictionary Regen

# Standalone byte-identical regen gate (D-11, DICT-05).
# Runs `pnpm gen:all && git diff --exit-code src/dictionary/generated/`
# to ensure the committed generated dictionary + Annex E artifacts stay
# byte-for-byte equivalent to what the pinned vendor inputs would produce.

on:
  push:
    branches: [main]
    paths:
      - "vendor/**"
      - "scripts/generate-dictionary.ts"
      - "scripts/generate-annex-e.ts"
      - "scripts/_annex-e-discovery.md"
      - "src/dictionary/generated/**"
      # The gate re-runs when the gate itself changes. Without this, a broken
      # workflow file cannot be proven fixed by the PR that fixes it.
      - ".github/workflows/dictionary-regen.yml"
  pull_request:
    branches: [main]
    paths:
      - "vendor/**"
      - "scripts/generate-dictionary.ts"
      - "scripts/generate-annex-e.ts"
      - "scripts/_annex-e-discovery.md"
      - "src/dictionary/generated/**"
      - ".github/workflows/dictionary-regen.yml"

permissions:
  contents: read

jobs:
  regen:
    name: byte-identical regen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` input. package.json's `packageManager` field is the single
      # source of truth for the pnpm version; passing both makes action-setup v6
      # fail hard with "Multiple versions of pnpm specified", which is what reds
      # every run of this workflow from 2026-06-24 onward.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate dictionary + Annex E
        run: pnpm gen:all

      - name: Verify byte-identical regen
        run: |
          drift=0
          git diff --exit-code src/dictionary/generated/ || drift=1

          # `git diff` reports modified *tracked* files only, so a generator that
          # started emitting a brand-new artifact would leave it untracked and
          # slip past the gate. src/dictionary/generated/ is not gitignored, so
          # anything untracked under it is real drift.
          untracked="$(git ls-files --others --exclude-standard -- src/dictionary/generated/)"
          if [ -n "$untracked" ]; then
            echo "Untracked generated artifacts:"
            echo "$untracked"
            drift=1
          fi

          if [ "$drift" -ne 0 ]; then
            echo "::error::Generated dictionary or Annex E artifact drifted from committed output."
            echo "Run 'pnpm gen:all' locally and commit the diff."
            echo "Pinned inputs are under vendor/innolitics/<sha>/ and (if used) vendor/nema/<sha>/."
            exit 1
          fi
