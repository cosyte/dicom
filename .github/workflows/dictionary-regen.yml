name: Dictionary Regen

# Standalone byte-identical regen gate (D-11, DICT-05).
# Runs `pnpm gen:all && git diff --exit-code src/dictionary/generated/`
# to ensure the committed generated dictionary + Annex E artifacts stay
# byte-for-byte equivalent to what the pinned vendor inputs would produce.

on:
  push:
    branches: [main]
    paths:
      - "vendor/**"
      - "scripts/generate-dictionary.ts"
      - "scripts/generate-annex-e.ts"
      - "scripts/generate-repeating-groups.ts"
      - "scripts/_annex-e-discovery.md"
      - "src/dictionary/generated/**"
      # `gen:all` and the generators' entry points live in package.json. Without
      # this, gutting `gen:all` to a no-op never triggers the gate at all.
      - "package.json"
      # The gate re-runs when the gate itself changes. Without this, a broken
      # workflow file cannot be proven fixed by the PR that fixes it.
      - ".github/workflows/dictionary-regen.yml"
  pull_request:
    branches: [main]
    paths:
      - "vendor/**"
      - "scripts/generate-dictionary.ts"
      - "scripts/generate-annex-e.ts"
      - "scripts/generate-repeating-groups.ts"
      - "scripts/_annex-e-discovery.md"
      - "src/dictionary/generated/**"
      - "package.json"
      - ".github/workflows/dictionary-regen.yml"

permissions:
  contents: read

jobs:
  regen:
    name: byte-identical regen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` input. package.json's `packageManager` field is the single
      # source of truth for the pnpm version; passing both makes action-setup v6
      # fail hard with "Multiple versions of pnpm specified", which is what reds
      # every run of this workflow from 2026-06-24 onward.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Delete the committed artifacts BEFORE regenerating, so the gate measures
      # what the generators actually produce rather than what happens to be on
      # disk. The gate must do this itself, not delegate it to `gen:all`, which
      # is the thing under test. Two ways the gate went green for the wrong
      # reason without it:
      #
      #   1. A stale orphan - an artifact a generator used to emit and no longer
      #      does - was never rewritten and never diffed, so it passed forever.
      #   2. Gutting `gen:all` to a no-op wrote nothing, left every committed
      #      artifact untouched, and produced an empty `git diff`: permanently
      #      green while generating nothing at all.
      #
      # After the delete, both reappear as deletions in `git diff` and red the
      # run. README.md is hand-written, not generated, so it is preserved.
      # `-mindepth 1` rather than `-type f`, so a stale symlink or a stale
      # subdirectory is cleaned too and cannot become an orphan the gate is
      # blind to. `-delete` unlinks a symlink itself and never follows it, so
      # nothing outside this directory is reachable. It also implies `-depth`,
      # so a subdirectory is emptied before it is removed. A missing directory
      # makes `find` exit non-zero and reds the run, which is the safe way for
      # this step to fail.
      - name: Clean generated artifacts before regen
        run: |
          find src/dictionary/generated -mindepth 1 ! -name 'README.md' -delete

          # Assert the precondition rather than printing it. A clean that
          # silently under-deleted would otherwise hand the next step a
          # directory it believes is empty, which is the same "green for the
          # wrong reason" shape this step exists to remove.
          remaining="$(find src/dictionary/generated -mindepth 1 ! -name 'README.md')"
          if [ -n "$remaining" ]; then
            echo "::error::Clean step left artifacts behind:"
            echo "$remaining"
            exit 1
          fi
          echo "Clean OK: only the hand-written README.md remains."

      - name: Regenerate repeating groups + dictionary + Annex E
        run: pnpm gen:all

      - name: Verify byte-identical regen
        run: |
          drift=0
          git diff --exit-code src/dictionary/generated/ || drift=1

          # `git diff` reports modified *tracked* files only, so a generator that
          # started emitting a brand-new artifact would leave it untracked and
          # slip past the gate. src/dictionary/generated/ is not gitignored, so
          # anything untracked under it is real drift.
          untracked="$(git ls-files --others --exclude-standard -- src/dictionary/generated/)"
          if [ -n "$untracked" ]; then
            echo "Untracked generated artifacts:"
            echo "$untracked"
            drift=1
          fi

          if [ "$drift" -ne 0 ]; then
            echo "::error::Generated dictionary or Annex E artifact drifted from committed output."
            echo "Run 'pnpm gen:all' locally and commit the diff."
            echo "Pinned inputs are under vendor/innolitics/<sha>/, vendor/nema/part05/<sha>/, vendor/nema/part05-2004/<sha>/, vendor/nema/part06/<sha>/, and vendor/nema/part15/<sha>/."
            exit 1
          fi
