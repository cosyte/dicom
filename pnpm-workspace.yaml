# Install-time hardening. `packageManager` above pnpm@10.21.0 is what puts both keys in force:
# an older pnpm ignores them, which is a settings file that decorates rather than defends.
#
# minimumReleaseAge: a package version younger than this many minutes is not installable, so a
# compromised release has to survive a day of public scrutiny before it can reach this tree.
# @cosyte is exempt by operator decision; every third-party package keeps the floor.
# trustPolicy: `no-downgrade` refuses a resolution that moves a package backwards.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # reason: first-party @cosyte package, exempt from the floor by operator decision
  - "@cosyte/*"
trustPolicy: no-downgrade
trustPolicyExclude:
  # reason: measured 2026-11-07 on pnpm 10.34.5. A from-scratch resolution reds with
  # ERR_PNPM_TRUST_DOWNGRADE on undici-types, reached through @types/node and pinned at exactly
  # this version by pnpm-lock.yaml: earlier releases carried a provenance attestation and this one
  # carries none, which is a publisher that stopped attaching provenance rather than a takeover. It
  # is a types-only tarball with no runtime code and no install scripts. Dependabot's security
  # update for vite failed on this same refusal. hl7, fhir and terminology exempt it too.
  - "undici-types@6.21.0"
  # reason: measured 2026-11-07 on pnpm 10.34.5, the same shape as the entry above and found by the
  # same from-scratch resolution once undici-types was exempt. chokidar is reached through tsup and
  # pinned at exactly this version by pnpm-lock.yaml; earlier releases carry a provenance
  # attestation and 4.0.3 carries none. pnpm's own documentation uses this package and version as
  # its worked example of a trustPolicyExclude entry (https://pnpm.io/settings/dependency-resolution).
  - "chokidar@4.0.3"
